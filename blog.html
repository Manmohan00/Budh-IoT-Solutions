<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Budh IoT Solutions</title>
<meta name="description" content="Notes on IoT development, prototyping and teaching IoT — from Budh IoT Solutions.">
<link rel="canonical" href="https://budhiotsolutions.com/blog.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sections-1.css">
<link rel="stylesheet" href="css/sections-2.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/logo.svg" alt="Budh IoT Solutions logo">
      <span class="brand-text">
        <span class="brand-name">Budh IoT Solutions</span>
        <span class="brand-tagline">Blog</span>
      </span>
    </a>
    <a class="btn btn-ghost" href="index.html">← Back to main site</a>
  </div>
</header>

<main>
  <section style="padding-bottom:20px;">
    <div class="wrap">
      <p class="eyebrow">Blog</p>
      <h1 style="font-size:clamp(28px,3.6vw,42px);">Notes on IoT, prototyping and teaching it.</h1>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="wrap">
      <div class="blog-grid" id="blogGridFull"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom" style="border-top:none; padding-top:0;">
    <span>© 2026 Budh IoT Solutions.</span>
    <a href="index.html">Back to main site</a>
  </div>
</footer>

<script src="data/blogs.js"></script>
<script>
  const grid = document.getElementById("blogGridFull");
  if (grid && typeof BLOG_POSTS !== "undefined") {
    const fmt = d => new Date(d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    grid.innerHTML = BLOG_POSTS.map(p => `
      <article class="card blog-card">
        <div class="blog-card-media"></div>
        <div class="blog-card-body">
          <span class="blog-date">${fmt(p.date)}</span>
          <h3>${p.title}</h3>
          <p>${p.excerpt}</p>
          <a class="blog-readmore" href="${p.url}">Read post →</a>
        </div>
      </article>`).join("");
  }
</script>
</body>
</html>
